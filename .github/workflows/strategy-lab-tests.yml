name: Strategy lab tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/automated-strategy-lab"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Run strategy lab tests
        run: python -m pytest -q tests/test_strategy_lab.py tests/test_evaluation.py

  app-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Streamlit page and mobile browser tests
        run: python -m pytest -q tests/test_app.py tests/test_mobile_browser.py
